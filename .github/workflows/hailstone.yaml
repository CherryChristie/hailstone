name: FULL CI/CD (Tests + Docker + Terraform + Deploy)

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

env:
  DOCKER_IMAGE_NAME: hailstone-app

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: pytest

  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build & Push Image
      run: |
        BRANCH_NAME=${GITHUB_REF##*/}
        IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/$DOCKER_IMAGE_NAME:$BRANCH_NAME
        echo "Building & pushing $IMAGE"
        docker build --build-arg ENV=$BRANCH_NAME -t $IMAGE .
        docker push $IMAGE

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: docker

    defaults:
      run:
        working-directory: terraform

    steps:
    - uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Clean up
      run: rm -rf .terraform

    - name: Terraform Init
      run: terraform init -backend-config "bucket=cloudcore0070"

    - name: Terraform Apply
      run: terraform apply -auto-approve

    - name: Save Public API Endpoint
      id: output
      run: |
        ENDPOINT=$(terraform output -raw api_endpoint || echo "N/A")
        echo "api_endpoint=$ENDPOINT" >> $GITHUB_OUTPUT
