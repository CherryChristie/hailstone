name: FULL CI/CD (Tests + Docker + Terraform + Deploy)

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

env:
  DOCKER_IMAGE_NAME: hailstone-app

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: pytest

  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        env: [dev, prod]

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build & Push Image
      run: |
        IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/$DOCKER_IMAGE_NAME:${{ matrix.env }}
        echo "Building & pushing $IMAGE"
        docker build --build-arg ENV=${{ matrix.env }} -t $IMAGE .
        docker push $IMAGE

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: docker

    strategy:
      matrix:
        env: [dev, prod]

    defaults:
      run:
        working-directory: terraform/${{ matrix.env }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init -backend-config "bucket=cloudcore0070"

    - name: Terraform Apply
      run: terraform apply -auto-approve

    - name: Save Public IP
      id: output
      run: |
        IP=$(terraform output -raw public_ip)
        echo "ip=$IP" >> $GITHUB_OUTPUT

